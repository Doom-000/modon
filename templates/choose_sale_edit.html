{% extends 'base.html' %}
{% block title %}แก้ไขการขาย{% endblock %}
{% block content %}
<div class="page-header">
    <h1>แก้ไขข้อมูลการขาย</h1>
    <a class="btn" href="{{ url_for('sales') }}">กลับหน้าการขาย</a>
</div>

<div class="card">
    <label for="sale_id">เลือกรายการขายที่ต้องการแก้ไข</label>
    <select id="sale_id" name="sale_id" onchange="if (this.value) window.location.href=this.value;">
        <option value="">-- เลือกรายการขาย --</option>
        {% for sale in sales %}
            <option value="{{ url_for('edit_sale', sale_id=sale.sale_id) }}">เลขที่ {{ sale.sale_id }} | {{ sale.sale_date }} | {{ sale.customer_name }}</option>
        {% endfor %}
    </select>
</div>
{% endblock %}
