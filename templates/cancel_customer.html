{% extends 'base.html' %}
{% block title %}ยกเลิกลูกค้า{% endblock %}
{% block content %}
<div class="page-header">
    <h1>ยกเลิกลูกค้า</h1>
    <a class="btn" href="{{ url_for('customers') }}">กลับหน้าลูกค้า</a>
</div>

<div class="card">
    <form method="POST" onsubmit="return confirm('ยืนยันการยกเลิกลูกค้าที่เลือกหรือไม่?');">
        <label for="customer_id">เลือกลูกค้าที่ต้องการยกเลิก</label>
        <select id="customer_id" name="customer_id" required>
            <option value="">-- เลือกลูกค้า --</option>
            {% for customer in customers %}
                <option value="{{ customer.customer_id }}">
                    {{ customer.customer_name }}{% if customer.phone_number %} | {{ customer.phone_number }}{% endif %}
                </option>
            {% endfor %}
        </select>
        <div class="form-actions">
            <button class="btn btn-danger" type="submit">ยกเลิกลูกค้า</button>
        </div>
    </form>
</div>
{% endblock %}
