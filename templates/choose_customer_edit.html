{% extends 'base.html' %}
{% block title %}แก้ไขลูกค้า{% endblock %}
{% block content %}
<div class="page-header">
    <h1>แก้ไขข้อมูลลูกค้า</h1>
    <a class="btn" href="{{ url_for('customers') }}">กลับหน้าลูกค้า</a>
</div>

<div class="card">
    <label for="customer_id">เลือกลูกค้าที่ต้องการแก้ไข</label>
    <select id="customer_id" name="customer_id" onchange="if (this.value) window.location.href=this.value;">
        <option value="">-- เลือกลูกค้า --</option>
        {% for customer in customers %}
            <option value="{{ url_for('edit_customer', customer_id=customer.customer_id) }}">{{ customer.customer_name }}</option>
        {% endfor %}
    </select>
</div>
{% endblock %}
