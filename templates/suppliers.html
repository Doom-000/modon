{% extends 'base.html' %}
{% block title %}Supplier List{% endblock %}
{% block content %}
<div class="page-header">
    <h1>ข้อมูล Supplier</h1>
</div>

<div class="card">
    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>รหัส Supplier</th>
                    <th>ชื่อ Supplier</th>
                    <th>เบอร์โทร</th>
                </tr>
            </thead>
            <tbody>
                {% for supplier in suppliers %}
                    <tr>
                        <td>{{ supplier.supplier_id }}</td>
                        <td>{{ supplier.supplier_name }}</td>
                        <td>{{ supplier.phone_number or '-' }}</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
